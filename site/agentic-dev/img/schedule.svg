<text class="hr" x="1160.0" y="70" text-anchor="middle">24:00</text>
<text class="lb" x="40" y="124">Runner</text><text class="sm" x="40" y="146">always on</text>
<text class="lb" x="40" y="204">Implementers</text><text class="sm" x="40" y="226">2 at a time</text>
<text class="lb" x="40" y="304">Architect</text><text class="sm" x="40" y="326">on the hour</text>
<text class="lb" x="40" y="384">Visionist loop</text><text class="sm" x="40" y="406">every 2 h at :17</text>
<text class="lb" x="40" y="464">Board sync</text><text class="sm" x="40" y="486">daily 05:05</text>
<text class="lb" x="40" y="544">Cache cleanup</text><text class="sm" x="40" y="566">daily 04:15</text>
