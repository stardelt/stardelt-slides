<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="st sd">
<title id="st">The day and the week</title>
<desc id="sd">One day in UTC. The runner is always on and keeps two implementer sessions busy. The architect starts on every hour. The visionist loop runs every two hours at 17 minutes past. The project board sync runs at 05:05 and the cache cleanup at 04:15. Once a week, on Thursday from 13:08 to 18:00 UTC, four Claude Fable agents run the deep review before the weekly quota resets.</desc>
<style>.lb{fill:#e8eaed;font-size:22px;font-weight:700;font-family:'Space Grotesk',Inter,sans-serif}.sm{fill:#8e949e;font-size:15px}.hr{fill:#8e949e;font-size:15px}.in{fill:#18191b;font-size:15px;font-weight:600}.n{fill:#b0b5bd;font-size:16px}</style>
