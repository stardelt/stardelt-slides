<line x1="945.0" y1="78" x2="945.0" y2="600" stroke="#3e4147" stroke-width="1"/>
<text class="hr" x="945.0" y="70" text-anchor="middle">18:00</text>
<line x1="1052.5" y1="78" x2="1052.5" y2="600" stroke="#3e4147" stroke-width="1"/>
<text class="hr" x="1052.5" y="70" text-anchor="middle">21:00</text>
